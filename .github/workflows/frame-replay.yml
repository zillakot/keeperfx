name: Frame replay

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/rust-target
      KFX_GPOLY_FIXTURE: ${{ github.workspace }}/out/gpoly-fixture.bin
      KFX_GPOLY_TRIANGLE_FIXTURE: ${{ github.workspace }}/out/gpoly-tests/triangles.bin
      KFX_MINIMAP_FIXTURE: ${{ github.workspace }}/out/minimap-tests/minimap.bin
      KFX_TRANSITION_FIXTURE: ${{ github.workspace }}/out/transition-tests/transitions.bin
      KFX_MAP_VIEW_FIXTURE: ${{ github.workspace }}/out/map-view-tests/map-views.bin
      KFX_MOVIE_FRAME_FIXTURE: ${{ github.workspace }}/out/movie-frame-tests/movie-frames.bin
      KFX_RAW_IMAGE_FIXTURE: ${{ github.workspace }}/out/raw-image-tests/raw-images.bin
      KFX_SPRITE_COPY_FIXTURE: ${{ github.workspace }}/out/sprite-tests/sprite-copies.bin
      KFX_SPRITE_FIXTURE: ${{ github.workspace }}/out/sprite-tests/sprites.bin
      KFX_SHADOW_FIXTURE: ${{ github.workspace }}/out/shadow-tests/shadows.bin
      KFX_TRIG_FIXTURE: ${{ github.workspace }}/out/trig-tests/trig.bin
      KFX_LENS_FIXTURE: ${{ github.workspace }}/out/lens-tests/lenses.bin
      KFX_PRIMITIVE_FIXTURE: ${{ github.workspace }}/out/primitive-tests/primitives.bin
      KFX_BITMAP_FIXTURE: ${{ github.workspace }}/out/bitmap-tests/bitmaps.bin
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check Rust
        run: |
          rustup update stable
          cargo fmt --manifest-path tools/frame-replay/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/frame-replay/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml
      - name: Check capture isolation and completeness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check native drawing bridge ordering, batching and recovery
        run: |
          cmake -S tests/terrain-bridge -B out/terrain-bridge-tests
          cmake --build out/terrain-bridge-tests --parallel 2
          ctest --test-dir out/terrain-bridge-tests --output-on-failure
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.12
          path: out/sdl-headers
      - name: Generate native gpoly drawing oracle
        run: |
          cmake -S tests/gpoly -B out/gpoly-tests -DKFX_GPOLY_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/gpoly-tests --parallel 2
          ctest --test-dir out/gpoly-tests --output-on-failure
          out/gpoly-tests/gpoly_capture_test "$KFX_GPOLY_FIXTURE"
          test -s "$KFX_GPOLY_TRIANGLE_FIXTURE"
      - name: Compare GPU triangle setup with native drawing
        run: cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test gpoly_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare production GPU triangles with native drawing
        run: cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_triangles_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare general GPU triangles with native drawing
        run: |
          cmake -S tests/trig -B out/trig-tests \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/trig-tests --parallel 2
          ctest --test-dir out/trig-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_trig_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare GPU creature shadows with native drawing
        run: |
          cmake -S tests/shadows -B out/shadow-tests \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/shadow-tests --parallel 2
          ctest --test-dir out/shadow-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_shadow_gpu -- --ignored --nocapture --test-threads=1
      - name: Generate native primitive drawing oracle
        run: |
          cmake -S tests/primitives -B out/primitive-tests -DKFX_PRIMITIVE_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/primitive-tests --parallel 2
          ctest --test-dir out/primitive-tests --output-on-failure
      - name: Generate native sprite drawing oracle
        run: |
          cmake -S tests/sprites -B out/sprite-tests -DKFX_SPRITE_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/sprite-tests --parallel 2
          ctest --test-dir out/sprite-tests --output-on-failure
      - name: Compare huge bitmap sprites and glyphs with native drawing
        run: |
          cmake -S tests/bitmaps -B out/bitmap-tests -DKFX_BITMAP_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/bitmap-tests --parallel 2
          ctest --test-dir out/bitmap-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_bitmap_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare minimap terrain with native drawing
        run: |
          cmake -S tests/minimap -B out/minimap-tests
          cmake --build out/minimap-tests --parallel 2
          ctest --test-dir out/minimap-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_minimap_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare map views with native drawing
        run: |
          cmake -S tests/map-views -B out/map-view-tests
          cmake --build out/map-view-tests --parallel 2
          ctest --test-dir out/map-view-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_map_view_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare transitions with native drawing
        run: |
          cmake -S tests/transitions -B out/transition-tests
          cmake --build out/transition-tests --parallel 2
          ctest --test-dir out/transition-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_transition_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare movie frames with native drawing
        run: |
          cmake -S tests/movie-frames -B out/movie-frame-tests
          cmake --build out/movie-frame-tests --parallel 2
          ctest --test-dir out/movie-frame-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_movie_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare raw images with native drawing
        run: |
          cmake -S tests/raw-images -B out/raw-image-tests -DKFX_RAW_IMAGE_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/raw-image-tests --parallel 2
          ctest --test-dir out/raw-image-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_raw_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare built-in lenses with native drawing
        run: |
          cmake -S tests/lens -B out/lens-tests
          cmake --build out/lens-tests --parallel 2
          ctest --test-dir out/lens-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_lenses_gpu -- --ignored --nocapture --test-threads=1
      - name: Build SDL3 surface runtime for native cursor oracle
        run: |
          cmake -S out/sdl-headers -B out/sdl-runtime -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/out/sdl-install" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST_LIBRARY=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_AUDIO=OFF -DSDL_VIDEO=OFF -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF -DSDL_HIDAPI=OFF -DSDL_SENSOR=OFF -DSDL_CAMERA=OFF
          cmake --build out/sdl-runtime --parallel 2
          cmake --install out/sdl-runtime
      - name: Compare native cursor lifecycle through the real drawing C ABI
        run: |
          cargo clippy --locked --manifest-path tools/frame-replay/Cargo.toml --features live-surface --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --features live-surface --lib live::
          cargo build --locked --manifest-path tools/frame-replay/Cargo.toml --features live-surface --lib
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/out/sdl-install/lib/pkgconfig"
          cmake -S tests/cursor -B out/cursor-tests \
            -DKFX_GPU_LIBRARY="$CARGO_TARGET_DIR/debug/libkeeperfx_frame_replay.a"
          cmake --build out/cursor-tests --parallel 2
          ctest --test-dir out/cursor-tests --output-on-failure
      - name: Verify native transition snapshot ownership
        run: |
          cmake -S tests/transitions -B out/transition-bridge-tests \
            -DKFX_GPU_LIBRARY="$CARGO_TARGET_DIR/debug/libkeeperfx_frame_replay.a"
          cmake --build out/transition-bridge-tests --target transition_bridge --parallel 2
          ctest --test-dir out/transition-bridge-tests -R transition_bridge --output-on-failure
      - name: Verify original vertex residency through the real drawing C ABI
        run: |
          cmake -S tests/terrain-vertices -B out/terrain-vertices-tests \
            -DKFX_GPU_LIBRARY="$CARGO_TARGET_DIR/debug/libkeeperfx_frame_replay.a" \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/terrain-vertices-tests --parallel 2
          ctest --test-dir out/terrain-vertices-tests --output-on-failure
      - name: Verify GPU target resource ownership through the real drawing C ABI
        run: |
          cmake -S tests/target-resources -B out/target-resource-tests \
            -DKFX_GPU_LIBRARY="$CARGO_TARGET_DIR/debug/libkeeperfx_frame_replay.a"
          cmake --build out/target-resource-tests --parallel 2
          ctest --test-dir out/target-resource-tests --output-on-failure
      - name: Verify GPU target snapshots and ordered sampling
        run: cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_target_resources_gpu -- --ignored --nocapture --test-threads=1
      - name: Replay synthetic frames and sequences
        run: |
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --lib -- --ignored --test-threads=1
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_limits_gpu -- --ignored --test-threads=1
          cargo build --locked --manifest-path tools/frame-replay/Cargo.toml
          python3 tools/frame-replay/tests/replay.py out/rust-target/debug/keeperfx-frame-replay out/synthetic-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-frame-reports
          path: out/synthetic-replay
