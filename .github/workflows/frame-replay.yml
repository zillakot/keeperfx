name: Frame replay

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/rust-target
      KFX_GPOLY_FIXTURE: ${{ github.workspace }}/out/gpoly-fixture.bin
      KFX_GPOLY_TRIANGLE_FIXTURE: ${{ github.workspace }}/out/gpoly-tests/triangles.bin
      KFX_RAW_IMAGE_FIXTURE: ${{ github.workspace }}/out/raw-image-tests/raw-images.bin
      KFX_SPRITE_FIXTURE: ${{ github.workspace }}/out/sprite-tests/sprites.bin
      KFX_PRIMITIVE_FIXTURE: ${{ github.workspace }}/out/primitive-tests/primitives.bin
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check Rust
        run: |
          rustup update stable
          cargo fmt --manifest-path tools/frame-replay/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/frame-replay/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml
      - name: Check capture isolation and completeness
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.12
          path: out/sdl-headers
          sparse-checkout: include
      - name: Generate native gpoly drawing oracle
        run: |
          cmake -S tests/gpoly -B out/gpoly-tests -DKFX_GPOLY_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/gpoly-tests --parallel 2
          ctest --test-dir out/gpoly-tests --output-on-failure
          out/gpoly-tests/gpoly_capture_test "$KFX_GPOLY_FIXTURE"
          test -s "$KFX_GPOLY_TRIANGLE_FIXTURE"
      - name: Compare GPU triangle setup with native drawing
        run: cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test gpoly_gpu -- --ignored --nocapture --test-threads=1
      - name: Compare production GPU triangles with native drawing
        run: cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_triangles_gpu -- --ignored --nocapture --test-threads=1
      - name: Generate native primitive drawing oracle
        run: |
          cmake -S tests/primitives -B out/primitive-tests -DKFX_PRIMITIVE_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/primitive-tests --parallel 2
          ctest --test-dir out/primitive-tests --output-on-failure
      - name: Generate native sprite drawing oracle
        run: |
          cmake -S tests/sprites -B out/sprite-tests -DKFX_SPRITE_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/sprite-tests --parallel 2
          ctest --test-dir out/sprite-tests --output-on-failure
      - name: Compare raw images with native drawing
        run: |
          cmake -S tests/raw-images -B out/raw-image-tests -DKFX_RAW_IMAGE_ASAN=ON \
            -DKFX_SDL3_INCLUDE_DIR="$GITHUB_WORKSPACE/out/sdl-headers/include"
          cmake --build out/raw-image-tests --parallel 2
          ctest --test-dir out/raw-image-tests --output-on-failure
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_raw_gpu -- --ignored --nocapture --test-threads=1
      - name: Replay synthetic frames and sequences
        run: |
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --lib -- --ignored --test-threads=1
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml --test draw_limits_gpu -- --ignored --test-threads=1
          cargo build --locked --manifest-path tools/frame-replay/Cargo.toml
          python3 tools/frame-replay/tests/replay.py out/rust-target/debug/keeperfx-frame-replay out/synthetic-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-frame-reports
          path: out/synthetic-replay
