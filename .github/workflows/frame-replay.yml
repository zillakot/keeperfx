name: Frame replay

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/out/rust-target
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Check Rust
        run: |
          rustup update stable
          cargo fmt --manifest-path tools/frame-replay/Cargo.toml --check
          cargo clippy --locked --manifest-path tools/frame-replay/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml
      - name: Check capture isolation and completeness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Replay synthetic frames and sequences
        run: |
          cargo test --locked --manifest-path tools/frame-replay/Cargo.toml -- --ignored
          cargo build --locked --manifest-path tools/frame-replay/Cargo.toml
          python3 tools/frame-replay/tests/replay.py out/rust-target/debug/keeperfx-frame-replay out/synthetic-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-frame-reports
          path: out/synthetic-replay
